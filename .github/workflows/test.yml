name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**.js"
      - ".github/workflows/*.yml"
      - "package.json"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing
    strategy:
      fail-fast: true
      matrix:
        version: [22, 23, 24, 25, 26, latest]
        os:
          [
            ubuntu-latest,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-24.04-arm,
            ubuntu-26.04-arm,
            macos-15-intel,
            macos-26-intel,
            macos-14,
            macos-15,
            macos-26,
            macos-latest,
          ]
        include:
          - os: ubuntu-latest
            node-version: 21
          - os: macos-latest
            node-version: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: |
          npm ci
          npm run test
